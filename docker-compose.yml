services:
  backend:
    build:
      context: ./backend
    container_name: routeweather-backend
    ports:
      - "8081:8081"
    environment:
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
    container_name: routeweather-frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
